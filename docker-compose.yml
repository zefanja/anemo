services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-anemo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anemo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-anemo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-anemo}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
      COGNITIVE_WEIGHT: ${COGNITIVE_WEIGHT:-0.5}
      SESSION_MAX_TOTAL: ${SESSION_MAX_TOTAL:-20}
      SESSION_MAX_REVIEW: ${SESSION_MAX_REVIEW:-10}
      REVIEW_UNLOCK_DAILY: ${REVIEW_UNLOCK_DAILY:-50}
      REVIEW_UNLOCK_PERCENT: ${REVIEW_UNLOCK_PERCENT:-80}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data:
